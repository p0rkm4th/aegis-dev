name: validation

on:
  push:
    branches: [main, aegis-dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,live]'
      - name: Run reproducible validation
        run: bash scripts/validate.sh
      - name: Apply migrations for PostgreSQL ownership acceptance
        env:
          PGPASSWORD: aegis
        run: for migration in migrations/*.sql; do psql -h 127.0.0.1 -U aegis -d aegis_test -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Run PostgreSQL atomic ownership acceptance
        env:
          AEGIS_TEST_DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis_test
        run: python -m pytest tests/test_action_claim.py tests/test_audit_postgres.py -q
      - name: Validate built artifacts in clean targets
        run: bash scripts/smoke_install.sh
