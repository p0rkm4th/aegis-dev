name: validation

on:
  push:
    branches: [main, aegis-dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,live]'
      - name: Run reproducible validation
        run: bash scripts/validate.sh
      - name: Validate built artifacts in clean targets
        run: bash scripts/smoke_install.sh
