name: validation

on:
  push:
    branches: [main, aegis-dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and attest developer sandbox primitives
        run: |
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v prlimit >/dev/null 2>&1; then
            installed=0
            for attempt in 1 2 3; do
              if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install --yes -o Acquire::Retries=3 bubblewrap util-linux; then
                installed=1
                break
              fi
              sleep 5
            done
            test "$installed" -eq 1
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            if ! sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; then
              echo "AppArmor userns sysctl is not writable; the bwrap attestation below remains authoritative."
            fi
          fi
          command -v bwrap
          command -v prlimit
          bwrap --version
          prlimit --version
          bwrap --die-with-parent --unshare-user --uid 0 --gid 0 --unshare-pid --proc /proc --dev /dev \
            --tmpfs /tmp --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 --clearenv \
            --setenv PATH /usr/bin:/bin -- true
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,live]'
      - name: Run reproducible validation
        run: bash scripts/validate.sh
      - name: Apply migrations for PostgreSQL ownership acceptance
        env:
          PGPASSWORD: aegis
        run: for migration in migrations/*.sql; do psql -h 127.0.0.1 -U aegis -d aegis_test -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Run PostgreSQL atomic ownership acceptance
        env:
          AEGIS_TEST_DATABASE_URL: postgresql://aegis:aegis@127.0.0.1:5432/aegis_test
        run: python -m pytest tests/test_action_claim.py tests/test_audit_postgres.py -q
      - name: Validate built artifacts in clean targets
        run: bash scripts/smoke_install.sh
