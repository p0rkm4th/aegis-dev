[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-core"
version = "0.1.0.dev1"
description = "Aegis local-first semantic intelligence core"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "psycopg[binary]>=3.2,<4"]

[project.scripts]
aegis = "aegis.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.25,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "copier==9.18.1",
]
live = ["cryptography>=43,<51", "websocket-client>=1.8,<2"]
research = ["trafilatura==2.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "aegis/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/aegis/web.py" = ["E501"]

[tool.mypy]
strict = true
packages = ["aegis"]
mypy_path = "src"
